location = /renko-monthly-weekly { return 301 /renko-monthly-weekly/; }
location = /renko-monthly-weekly/manage { return 301 /renko-monthly-weekly/manage/; }
location ^~ /renko-monthly-weekly/manage/ {
    auth_basic "Index Pro Fyers";
    auth_basic_user_file /etc/nginx/.htpasswd-index-pro-fyers;
    proxy_pass http://127.0.0.1:8838/;
    proxy_set_header Host $host;
    proxy_set_header X-Authenticated-User $remote_user;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'" always;
}
location ^~ /renko-monthly-weekly/ {
    auth_basic off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8838/;
    proxy_set_header Host $host;
    proxy_set_header X-Authenticated-User "";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'" always;
}
